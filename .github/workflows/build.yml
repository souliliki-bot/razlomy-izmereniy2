name: Build Minecraft Mod

on:
  push:
    branches:
      - feature/rift-mechanics
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build mod
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Razlomy-Izmereniy-1.0.0
          path: build/libs/razlomy-izmereniy-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
